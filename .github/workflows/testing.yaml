---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Unit tests for the lane logic ###
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the organisation's
      # .github repository and publish it as $CONNECTION_ALLOW_LIST for
      # the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The suite uses a fake client, so it needs neither credentials nor
      # network access.
      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          python3 -m unittest discover -s tests -p "test_*.py" -v

  ### Input validation for the action wrapper ###
  validation:
    name: "Input validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # Failure testing is also important: an unknown mode must fail.
      - name: "Reject an unknown mode [expected failure]"
        id: badmode
        uses: $/
        continue-on-error: true
        with:
          mode: "publish"
          rtd_token: "placeholder-not-used"

      - name: "Error if the unknown mode did NOT fail"
        if: steps.badmode.outcome == 'success'
        shell: bash
        run: |
          # Error if the unknown mode did NOT fail
          echo "Error: an unknown mode should fail the action ❌"
          exit 1

      - name: "Reject an empty token [expected failure]"
        id: notoken
        uses: $/
        continue-on-error: true
        with:
          mode: "verify"
          rtd_token: ""

      - name: "Error if the empty token did NOT fail"
        if: steps.notoken.outcome == 'success'
        shell: bash
        run: |
          # Error if the empty token did NOT fail
          echo "Error: an empty token should fail the action ❌"
          exit 1

      - name: "Reject a non-numeric timeout [expected failure]"
        id: badtimeout
        uses: $/
        continue-on-error: true
        with:
          mode: "verify"
          rtd_token: "placeholder-not-used"
          build_timeout: "soon"

      - name: "Error if the invalid timeout did NOT fail"
        if: steps.badtimeout.outcome == 'success'
        shell: bash
        run: |
          # Error if the invalid timeout did NOT fail
          echo "Error: a non-numeric timeout should fail the action ❌"
          exit 1

      # A change URL carrying no umbrella must fail before any API call.
      - name: "Reject an underivable name [expected failure]"
        id: badurl
        uses: $/
        continue-on-error: true
        with:
          mode: "verify"
          rtd_token: "placeholder-not-used"
          gerrit_project: "example"
          gerrit_change_url: "not-a-url"

      - name: "Error if the underivable name did NOT fail"
        if: steps.badurl.outcome == 'success'
        shell: bash
        run: |
          # Error if the underivable name did NOT fail
          echo "Error: an underivable name should fail the action ❌"
          exit 1

      - name: "Report success"
        shell: bash
        run: |
          # Report success
          echo "All validation tests passed ✅"
          echo "All validation tests passed ✅" >> "$GITHUB_STEP_SUMMARY"

  ### Test that modules in the caller's workspace are never imported ###
  workspace-modules:
    name: "Ignore modules in the workspace"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Stands in for uvx, answering the one lftools-uv call the verify
      # lane makes with explicit project names, so the whole step runs
      # without credentials or network access.
      - name: "Provide a stub uvx"
        shell: bash
        run: |
          # Provide a stub uvx
          set -euo pipefail
          stub="$RUNNER_TEMP/stub-bin"
          mkdir -p "$stub"
          cat > "$stub/uvx" <<'STUB'
          #!/bin/bash
          # Expects: --quiet --from SPEC lftools-uv rtd COMMAND ARGS --json
          if [ "${5:-}" = "rtd" ] && [ "${6:-}" = "project-details" ]; then
            printf '{"slug": "%s", "default_version": "latest"}\n' "$7"
            exit 0
          fi
          echo "stub uvx: unexpected call: $*" >&2
          exit 1
          STUB
          chmod +x "$stub/uvx"
          echo "$stub" >> "$GITHUB_PATH"

      # Each planted module records its name in a marker file and exits
      # non-zero, so importing any of them in place of the real module
      # shows up in the marker and breaks the lane.
      - name: "Plant modules in the workspace"
        shell: bash
        run: |
          # Plant modules in the workspace
          set -euo pipefail
          body='import os
          marker = os.path.join(os.environ["RUNNER_TEMP"], "planted-ran")
          with open(marker, "a") as f:
              f.write(__name__ + "\n")
          raise SystemExit(97)
          '
          modules=(json argparse logging subprocess shutil secrets
                   dataclasses sitecustomize)
          for module in "${modules[@]}"; do
            printf '%s\n' "$body" > "$module.py"
          done
          mkdir -p lib
          printf '%s\n' "$body" > lib/__init__.py
          echo "Planted modules in $PWD ✅"

      - name: "Run the verify lane"
        id: planted
        uses: $/
        continue-on-error: true
        with:
          mode: "verify"
          rtd_token: "placeholder-not-used"
          project: "example-docs"
          parent_project: "example"

      - name: "Validate the result"
        shell: bash
        env:
          OUTCOME: ${{ steps.planted.outcome }}
          PROJECT: ${{ steps.planted.outputs.project }}
          PARENT: ${{ steps.planted.outputs.parent_project }}
          VERSION: ${{ steps.planted.outputs.version_slug }}
          EXISTS: ${{ steps.planted.outputs.project_exists }}
          URL: ${{ steps.planted.outputs.documentation_url }}
        run: |
          # Validate the result
          fail=0
          if [ -e "$RUNNER_TEMP/planted-ran" ]; then
            echo "Error: the action imported planted modules ❌"
            cat "$RUNNER_TEMP/planted-ran"
            fail=1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "Expected the lane to succeed, received $OUTCOME ❌"
            fail=1
          fi
          expected="example-docs example latest true"
          received="$PROJECT $PARENT $VERSION $EXISTS"
          if [ "$received" != "$expected" ]; then
            echo "Expected '$expected', received '$received' ❌"
            fail=1
          fi
          if [ "$URL" != "https://example-docs.readthedocs.io" ]; then
            echo "Unexpected documentation_url: $URL ❌"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "No planted module was imported ✅"
          fi
          exit "$fail"
